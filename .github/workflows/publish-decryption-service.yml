# Publishes the decryption enclave to GHCR using its release config.
# The image tag includes the network and commit. Turnkey pulls it anonymously, so the
# package must be public. Operators pass the image reference from the run
# summary to cargo xtask describe.

name: publish-decryption-service

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network the image is built for
        type: choice
        options: [devnet, mainnet]
        required: true

permissions:
  contents: read

concurrency:
  group: publish-decryption-service-${{ inputs.network }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: decryption-image-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require publisher setup
        env:
          PUBLISH_ENABLED: ${{ vars.DECRYPTION_IMAGE_PUBLISH_ENABLED }}
        run: |
          if [[ "$PUBLISH_ENABLED" != true ]]; then
            echo "::error::Configure the decryption-image-publish environment before enabling its publisher"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        env:
          NETWORK: ${{ inputs.network }}
        run: |
          release="services/decryption-service/enclave/deploy/release.json"
          repository="$(jq -er .imageRepository "$release")"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:decryption-service-${NETWORK}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One linux/amd64 manifest without attestations, which Turnkey pulls.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/decryption-service/enclave/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            SPR_NETWORK=${{ inputs.network }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=decryption-service-${{ inputs.network }}
          cache-to: type=gha,mode=max,scope=decryption-service-${{ inputs.network }}

      - name: Attest the image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Report pinned reference
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          pivot_digest="$(docker run --rm --platform linux/amd64 --entrypoint sha256sum "$IMAGE" /tvc_app | cut -d' ' -f1)"
          {
            echo "### decryption-service (${{ inputs.network }})"
            echo '```'
            echo "image:           $IMAGE"
            echo "/tvc_app sha256: $pivot_digest"
            echo "source commit:   $GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
