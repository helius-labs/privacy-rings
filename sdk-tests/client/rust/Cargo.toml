[package]
name = "client-example"
version = "0.1.0"
edition.workspace = true
publish = false
autoexamples = false

[features]
devnet-decryption = ["dep:base64", "dep:getrandom", "dep:hex", "dep:qos_nsm", "dep:qos_p256", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:solana-system-interface", "dep:spr-tvc-protocol"]

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true, optional = true }
getrandom = { version = "0.4", optional = true }
hex = { workspace = true, optional = true }
qos_nsm = { version = "=0.16.3", default-features = false, optional = true }
qos_p256 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
solana-system-interface = { workspace = true, optional = true }
spr-tvc-protocol = { path = "../../../services/decryption-service/protocol", optional = true }
spr-protocol-instructions = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-program = { workspace = true }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[[example]]
name = "deposit_transfer_withdraw"
path = "deposit_transfer_withdraw.rs"

[[example]]
name = "merge_transfer"
path = "merge_transfer.rs"

[[example]]
name = "optimized_merge_transfer"
path = "optimized_merge_transfer.rs"

[[test]]
name = "devnet-decryption"
path = "tests/decryption/main.rs"
required-features = ["devnet-decryption"]
